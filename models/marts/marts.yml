version: 2

models:
  - name: dim_households
    description: "The primary Dimension table for households. Contains static attributes and behavioral segments."
    columns:
      - name: meter_id
        data_tests:
          - unique
          - not_null

  - name: fct_daily_energy
    description: "The central Fact table for the project. Contains daily telemetry, rolling trends, and anomaly flags."
    columns:
      - name: energy_fact_id
        data_tests:
          - unique
          - not_null
      - name: meter_id
        data_tests:
          - relationships:
              to: ref('dim_households')
              field: meter_id